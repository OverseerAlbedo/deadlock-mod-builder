<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121518">
<title>$title</title>
<meta name="description" content="$description">
$head_extra<link rel="stylesheet" href="${root}assets/style.css">
<link rel="icon" href="${root}favicon.ico" sizes="any">
<link rel="icon" href="${root}assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="${root}assets/icon.png">
$social$json_ld</head>
<body>
<a class="skip-link" href="#main">$skip_label</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="${home_href}"><img src="${root}assets/icon.svg" alt="" width="32" height="32"><span>$site_name</span></a>
    <nav class="site-nav" aria-label="$nav_label">
      <ul>
$nav_items
      </ul>
    </nav>
$language_menu  </div>
</header>
<main id="main" tabindex="-1">
$main
</main>
<footer class="site-footer">
  <div class="wrap">
    $footer
  </div>
</footer>
</body>
</html>
