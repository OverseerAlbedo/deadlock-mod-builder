name: Windows tests and portable application

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Build the installer for an explicitly requested release
        type: boolean
        default: false

# Build artifacts only. CI cannot publish a release or tag.
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_BACKTRACE: '1'
      # Optional: a token that can read OverseerAlbedo/deadlock-mod-builder-private-assets.
      # With it the build carries the TangTang presets and the captured-rig tests run;
      # without it everything builds and tests the same from the public source alone.
      PRIVATE_ASSETS_TOKEN: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
      DMB_RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    steps:
      - name: Check out source without changing fixture bytes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the private assets (TangTang presets, captured rig fixtures) when a token is configured
        if: env.PRIVATE_ASSETS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: OverseerAlbedo/deadlock-mod-builder-private-assets
          token: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
          path: private-assets
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies and builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Ensure WebView2 Runtime for the Windows startup test
        run: ./scripts/ensure-webview2.ps1
      - name: Test, build and validate Windows distribution
        # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...)
        # that the app resolves to its long spelling; tests expect one spelling.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          if ($env:DMB_RELEASE_BUILD -eq 'true') {
            ./scripts/build-windows.ps1 -Release
          } else {
            ./scripts/build-windows.ps1
          }
      - name: Upload validated Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DeadlockModBuilder-Windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeadlockModBuilder-Windows-validation
          path: artifacts/validation/
          if-no-files-found: warn
          retention-days: 14
