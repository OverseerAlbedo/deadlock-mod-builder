name: Website

# Builds the project website (site/build.py) and deploys it to GitHub Pages.
# Requires Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - README.md
      - CHANGELOG.md
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
# One deployment at a time; a running deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source with history (sitemap dates come from git log)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install site dependencies
        run: python -m pip install -r site/requirements.txt
      - name: Build and check the site
        run: python site/build.py
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  notify:
    # Tells the IndexNow search engines (Bing and others) which pages changed.
    # A failure here does not fail the deployment.
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Submit the changed pages to IndexNow
        run: python3 site/indexnow.py
