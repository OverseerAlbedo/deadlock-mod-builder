name: Release

# Publishes a release only when started by hand (Actions → Release → Run
# workflow). Pushes never publish; the Windows tests workflow stays read-only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, exactly as in package.json (for example 0.13.0-beta.3)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a pre-release
        type: boolean
        default: true

permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_BACKTRACE: '1'
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source without changing fixture bytes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the requested version before building
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "Releases are made from main, not $env:GITHUB_REF." }
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($package -ne $env:VERSION) { throw "Requested $env:VERSION but package.json has $package. Bump the version and push first." }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## $env:VERSION" -Quiet)) { throw "CHANGELOG.md has no section for $env:VERSION." }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG already exists; published releases are never replaced." }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" --silent 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:TAG already exists." }
          node scripts/check-repository.mjs
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies and builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Ensure WebView2 Runtime for the Windows startup test
        run: ./scripts/ensure-webview2.ps1
      - name: Test, build installer and validate Windows distribution
        # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...)
        # that the app resolves to its long spelling; tests expect one spelling.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/build-windows.ps1 -Release
      - name: Publish the release with the installer
        run: |
          $installer = "artifacts/release/DeadlockModBuilder-v$env:VERSION-windows-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = (Get-Content docs/RELEASE_NOTES.md -Raw) + "`n`n---`nInstaller SHA-256: ``$sha```nBuilt and tested by GitHub Actions from commit $env:GITHUB_SHA.`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $arguments = @($env:TAG, $installer, '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA,
            '--title', "Deadlock Mod Builder $env:VERSION", '--notes-file', 'release-notes.md')
          if ('${{ inputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }
          gh release create @arguments
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }
      - name: Retain validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeadlockModBuilder-release-validation
          path: artifacts/validation/
          if-no-files-found: warn
          retention-days: 30
