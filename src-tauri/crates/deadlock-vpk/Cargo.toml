[package]
name = "deadlock-vpk"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
deadlock-core = { path = "../deadlock-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
same-file = "1.0"
tempfile = "3"

[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
