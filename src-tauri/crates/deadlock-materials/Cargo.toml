[package]
name = "deadlock-materials"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
# Test builds only: opens color range abilities that are switched off (`deadlock_project::color_ranges::open_for_test`).
color-test-switches = ["deadlock-project/color-test-switches"]

[dependencies]
deadlock-core = { path = "../deadlock-core" }
deadlock-project = { path = "../deadlock-project" }
deadlock-dmx = { path = "../deadlock-dmx" }
deadlock-vpk = { path = "../deadlock-vpk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
regex = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "tiff", "exr"] }
tiff = { version = "0.11.3", default-features = false }
crc32fast = "1"
# Deflate in ZIP files through the pure-Rust backend; zip's own "deflate" feature would select zlib-rs.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
lzma-rs = { version = "0.3", features = ["stream"] }
tempfile = "3"
# bzip2 0.6 reads through the pure-Rust libbz2-rs-sys by default. LZMA entries are
# decoded by source_zip.rs through lzma-rs, so zip's own LZMA decoder is not built.
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2", "deflate-zopfli", "bzip2"] }

[dev-dependencies]
