[package]
name = "deadlock-tools"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
deadlock-core = { path = "../deadlock-core" }
deadlock-project = { path = "../deadlock-project" }
deadlock-model = { path = "../deadlock-model" }
deadlock-vpk = { path = "../deadlock-vpk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
regex = "1"
memchr = "2"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
