[package]
name = "deadlock-project"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
# Test builds only: lets an example or end-to-end test open color range abilities that are switched off.
color-test-switches = []

[dependencies]
deadlock-core = { path = "../deadlock-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
