[package]
name = "deadlock-skeleton"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v5"] }
deadlock-core = { path = "../deadlock-core" }
deadlock-dmx = { path = "../deadlock-dmx" }
deadlock-resource = { path = "../deadlock-resource" }
deadlock-vpk = { path = "../deadlock-vpk" }

[dev-dependencies]
tempfile = "3"
