[package]
name = "deadlock-preview"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
deadlock-core = { path = "../deadlock-core" }
deadlock-dmx = { path = "../deadlock-dmx" }
deadlock-vpk = { path = "../deadlock-vpk" }
base64 = "0.22"
percent-encoding = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
same-file = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
